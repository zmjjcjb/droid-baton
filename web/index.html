<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Droid Baton · 本地任务</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><header><div><span class="logo">↗</span><strong>Droid Baton</strong><span class="sub">Codex 派发 · Droid 执行</span></div><span id="connection">连接中</span></header>
<main><aside><div class="row"><h2>任务</h2><button id="refresh">刷新</button></div><div id="runs"></div></aside>
<section><div id="notice" role="status"></div><article id="detail"><h1>把任务交给 Droid</h1><p>在这里查看执行过程，补充要求，或回答 Droid 的问题。</p></article>
<article><h2 id="compose-title">新建任务</h2><form id="compose"><label>工作目录<input id="cwd" placeholder="/absolute/path/to/project" required></label><label>任务或补充要求<textarea id="message" rows="4" required placeholder="说明目标、允许修改的范围和验收方式"></textarea></label><label>验收命令（每行一条，可选）<textarea id="checks" rows="2" placeholder="npm test"></textarea></label><label class="row"><input id="supervision" type="checkbox">启用长期目标监督：多轮续做、独立验收、停滞提醒</label><div class="row"><select id="mode"><option value="new">新任务</option><option value="followup">在当前会话续聊 / 排队</option><option value="steer">补充到正在执行的任务</option></select><button class="primary" type="submit">发送给 Droid</button></div><p class="hint">沿用 Droid 的模型与权限设置。需要批准或回答时，任务会等待你的决定。</p></form></article></section></main></body></html>
